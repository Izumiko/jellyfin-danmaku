name: DEPLOY
on:
  pull_request:
    branches:
    - jellyfin
    paths:
    - "src/**"
    - "build/**"
    - "public/**"
    - "tests/**"
    - "package.json"
    - "bun.lock"
    - ".github/workflows/DEPLOY.yml"
  push:
    branches:
    - jellyfin
    paths:
    - "src/**"
    - "build/**"
    - "public/**"
    - "package.json"
    - "bun.lock"
    - ".github/workflows/DEPLOY.yml"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
    - name: Install
      run: bun install --frozen-lockfile
    - name: Typecheck
      run: bun run typecheck
    - name: Svelte check
      run: bun run check
    - name: Lint
      run: bun run lint
    - name: Test
      run: bun run test
  release:
    needs: check
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/jellyfin'
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
    - name: Install
      run: bun install --frozen-lockfile
    - name: Build
      run: |
        bun run build:all
        # 兼容旧安装地址：Tampermonkey 的 @updateURL 和服务端 <script> 注入都指向 ede.user.js
        cp dist/jellyfin-danmaku.user.js dist/ede.user.js
    - name: Deploy github pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist
        keep_files: true
    - name: Purge CDN cache
      run: |
        curl https://purge.jsdelivr.net/gh/Izumiko/jellyfin-danmaku@gh-pages/ede.user.js
        curl https://purge.jsdelivr.net/gh/Izumiko/jellyfin-danmaku@gh-pages/ede.min.js
        curl https://purge.jsdelivr.net/gh/Izumiko/jellyfin-danmaku@gh-pages/jellyfin-danmaku.user.js
