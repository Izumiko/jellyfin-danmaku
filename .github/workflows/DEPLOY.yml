name: DEPLOY
on:
  pull_request:
    branches:
    - jellyfin
    - typescript
    paths:
    - "src/**"
    - "build/**"
    - "public/**"
    - "tests/**"
    - "tools/**"
    - "package.json"
    - "pnpm-lock.yaml"
    - "vitest.config.ts"
    - "tsconfig*.json"
    - "eslint.config.js"
    - ".prettierrc.json"
    - ".github/workflows/DEPLOY.yml"
  push:
    branches:
    - jellyfin
    - typescript
    paths:
    - "src/**"
    - "build/**"
    - "public/**"
    - "tests/**"
    - "tools/**"
    - "package.json"
    - "pnpm-lock.yaml"
    - "vitest.config.ts"
    - "tsconfig*.json"
    - "eslint.config.js"
    - ".prettierrc.json"
    - ".github/workflows/DEPLOY.yml"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 26
        cache: pnpm
    - name: Install
      run: pnpm install --frozen-lockfile
    - name: Typecheck
      run: pnpm run typecheck
    - name: Svelte check
      run: pnpm run check
    - name: Lint
      run: pnpm run lint
    - name: Format check
      run: pnpm run format:check
    - name: Test with coverage
      run: pnpm run test:coverage
    - name: Build
      run: pnpm run build:all
  release:
    needs: check
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/jellyfin'
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 26
        cache: pnpm
    - name: Install
      run: pnpm install --frozen-lockfile
    - name: Build
      run: pnpm run build:all
    - name: Deploy github pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist
        keep_files: true
    - name: Purge CDN cache
      run: |
        curl https://purge.jsdelivr.net/gh/Izumiko/jellyfin-danmaku@gh-pages/ede.user.js
        curl https://purge.jsdelivr.net/gh/Izumiko/jellyfin-danmaku@gh-pages/ede.min.js
        curl https://purge.jsdelivr.net/gh/Izumiko/jellyfin-danmaku@gh-pages/jellyfin-danmaku.user.js
